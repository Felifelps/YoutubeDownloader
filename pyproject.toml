# Configuration for `flet build` (Android / iOS / desktop / web bundles).
#
# `flet build` reads only [project.dependencies] below — the runtime that ships
# inside the bundle — so the desktop-only pieces live in the `dev` dependency
# group instead. For local development install everything with `uv sync`
# (`pip install -r requirements.txt` does the same without uv).

[project]
name = "youtubedownloader"
version = "1.0.0"
description = "Download YouTube videos and playlists"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Felifelps", email = "felifelps.dev@gmail.com" }]
dependencies = [
    "flet==0.28.3",
    "yt-dlp",
]

[dependency-groups]
dev = [
    # `desktop` installs the right desktop runtime per OS (flet-desktop on
    # Windows/macOS, flet-desktop-light on Linux); `cli` provides `flet build`.
    "flet[desktop,cli]==0.28.3",
    # Bundled ffmpeg: needed to convert audio to mp3 and write the song tags.
    "imageio-ffmpeg",
]


[tool.flet]
org = "com.felifelps"
product = "YoutubeDownloader"
company = "felifelps.dev"
copyright = "Copyright (C) 2026 felifelps.dev"
# Keep the dev virtualenv, git history and build output out of the APK.
exclude = [".venv", ".git", ".github", ".dart_tool", "__pycache__", "build", ".claude", "dist"]

[tool.flet.app]
exclude = [".venv", ".git", ".github", ".dart_tool", "__pycache__", "build", ".claude", "dist"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
